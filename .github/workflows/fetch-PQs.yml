name: Fetch Daily Oireachtas Questions (paginated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (rolling refresh window) or backfill_2025 (fetch full year 2025)"
        required: true
        default: "daily"
      window_days:
        description: "For mode=daily: how many days back to refresh (e.g. 14, 30, 183)."
        required: false
        default: "30"
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 a.m. GMT/UTC

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Ensure package.json for ES modules
        run: |
          echo '{ "type": "module" }' > package.json

      - name: Fetch PQ data with pagination (rolling refresh or 2025 backfill)
        run: |
          set -euo pipefail

          # Scheduled runs always do "daily" rolling refresh
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            WINDOW_DAYS="${{ inputs.window_days }}"
          else
            MODE="daily"
            WINDOW_DAYS="30"
          fi

          # Refresh ends at yesterday (UTC) to avoid partial "today" data
          END_DATE=$(date -u -d "yesterday" +%F)

          touch fetch-log.txt
          echo "🕓 PQ fetch started at $(date -u)" > fetch-log.txt
          echo "Mode: $MODE" | tee -a fetch-log.txt
          echo "End date (UTC): $END_DATE" | tee -a fetch-log.txt
          if [ "$MODE" = "daily" ]; then
            echo "Rolling window days: $WINDOW_DAYS" | tee -a fetch-log.txt
          fi

          fetch_one_day () {
            local DATE="$1"
            local YEAR
            YEAR=$(date -u -d "$DATE" +%Y)

            local DIR="data/PQs_paginated/$YEAR"
            local FILE="$DIR/day_${DATE}.json"
            mkdir -p "$DIR"

            echo "📅 Fetching: $DATE (year $YEAR)" | tee -a fetch-log.txt

            local PAGE=0
            local ALL_RESULTS="[]"
            local success=false

            while true; do
              local SKIP=$((PAGE * 300))
              local URL="https://api.oireachtas.ie/v1/questions?date_start=${DATE}&date_end=${DATE}&limit=300&skip=${SKIP}&qtype=oral,written&show_answers=false"
              local TEMPFILE="tmp_day_page.json"

              curl -s -w "%{http_code}" -o "$TEMPFILE" "$URL" > curl_status.txt
              local STATUS
              STATUS=$(tail -n1 curl_status.txt)

              if [ "$STATUS" -eq 200 ]; then
                if jq -e '.message' "$TEMPFILE" >/dev/null 2>&1; then
                  echo "⚠️ API error on page $PAGE — retrying..." | tee -a fetch-log.txt
                elif jq -e '.results' "$TEMPFILE" >/dev/null 2>&1; then
                  local COUNT
                  COUNT=$(jq '.results | length' "$TEMPFILE")

                  if [ "$COUNT" -eq 0 ]; then
                    echo "✅ $DATE complete — no more results after page $PAGE" | tee -a fetch-log.txt
                    success=true
                    break
                  fi

                  ALL_RESULTS=$(jq -s '.[0] + .[1]' <(echo "$ALL_RESULTS") <(jq '.results' "$TEMPFILE"))
                  echo "✅ Page $PAGE for $DATE OK — $COUNT results" | tee -a fetch-log.txt
                  PAGE=$((PAGE + 1))
                else
                  echo "❌ Malformed JSON on page $PAGE — retrying..." | tee -a fetch-log.txt
                fi
              else
                echo "❌ HTTP $STATUS on page $PAGE — retrying..." | tee -a fetch-log.txt
              fi

              sleep 5
            done

            if [ "$success" = true ]; then
              echo "$ALL_RESULTS" > "$FILE"
              echo "💾 Wrote $FILE" | tee -a fetch-log.txt
            else
              if [ -f "$FILE" ]; then
                echo "🛑 Failed to fully fetch $DATE — using existing file" | tee -a fetch-log.txt
              else
                echo "🛑 No data for $DATE and no previous file exists" | tee -a fetch-log.txt
              fi
            fi
          }

          if [ "$MODE" = "backfill_2025" ]; then
            echo "🔁 Backfilling full year 2025..." | tee -a fetch-log.txt
            mkdir -p data/PQs_paginated/2025

            for day in $(seq -w 0 364); do
              DATE=$(date -u -d "2025-01-01 +${day} days" +%F)
              fetch_one_day "$DATE" || true
              echo "🕒 Sleeping 3s..." | tee -a fetch-log.txt
              sleep 3
            done

            echo "🚀 Merging 2025..." | tee -a fetch-log.txt
            node scripts/merge-days-paginated.js 2025

          else
            # Rolling refresh window ending at END_DATE
            # Start date is END_DATE - (WINDOW_DAYS - 1)
            START_DATE=$(date -u -d "$END_DATE -$((WINDOW_DAYS - 1)) days" +%F)
            echo "Refreshing range: $START_DATE → $END_DATE" | tee -a fetch-log.txt

            d="$START_DATE"
            while [ "$(date -u -d "$d" +%s)" -le "$(date -u -d "$END_DATE" +%s)" ]; do
              fetch_one_day "$d" || true
              echo "🕒 Sleeping 3s..." | tee -a fetch-log.txt
              sleep 3
              d=$(date -u -d "$d +1 day" +%F)
            done

            # Merge current year, and previous year if the window crosses Jan 1
            YEAR_END=$(date -u -d "$END_DATE" +%Y)
            YEAR_START=$(date -u -d "$START_DATE" +%Y)

            echo "🚀 Merging year $YEAR_END..." | tee -a fetch-log.txt
            node scripts/merge-days-paginated.js "$YEAR_END"

            if [ "$YEAR_START" -lt "$YEAR_END" ]; then
              echo "🚀 Window crosses year boundary — merging year $YEAR_START..." | tee -a fetch-log.txt
              node scripts/merge-days-paginated.js "$YEAR_START"
            fi
          fi

          rm -f tmp_day_page.json curl_status.txt
          echo "✅ PQ fetch completed at $(date -u)" >> fetch-log.txt

      - name: Commit daily and merged files to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/PQs_paginated PQs_*_paginated.json fetch-log.txt scripts/merge-days-paginated.js package.json

          echo "🔍 Changed files:"
          git diff --name-only
          echo "📦 Files staged for commit:"
          git diff --cached --name-only

          if git diff --cached --quiet; then
            echo "⚠️ Nothing to commit — skipping push"
          else
            echo "📝 Committing changes..."
            git commit -m "Automated PQ fetch and yearly merge" || {
              echo "❌ Git commit failed"
              exit 2
            }

            echo "🔄 Pulling with rebase to avoid conflicts..."
            git pull --rebase origin main || {
              echo "❌ Git pull with rebase failed"
              exit 2
            }

            echo "🚀 Pushing to origin..."
            git push origin HEAD || {
              echo "❌ Git push failed"
              exit 2
            }
          fi
