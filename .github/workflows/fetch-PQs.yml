name: Fetch Daily Oireachtas Questions (paginated)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 a.m. GMT

jobs:
  fetch-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch rolling-window PQ data with pagination (year-aware)
        run: |
          set -euo pipefail

          # Refresh window (≈ 6 months). Adjust if you want.
          WINDOW_DAYS=183

          TODAY=$(date -u +%F)
          WINDOW_START=$(date -u -d "$TODAY -$WINDOW_DAYS days" +%F)

          mkdir -p data/PQs_paginated
          touch fetch-log.txt
          echo "🕓 Rolling fetch started at $(date -u)" > fetch-log.txt
          echo "Today: $TODAY | Window start: $WINDOW_START | Window days: $WINDOW_DAYS" | tee -a fetch-log.txt

          fetch_one_day () {
            local DATE="$1"
            local YEAR
            YEAR=$(date -u -d "$DATE" +%Y)

            local DIR="data/PQs_paginated/$YEAR"
            local FILE="$DIR/day_${DATE}.json"
            mkdir -p "$DIR"

            echo "📅 Fetching: $DATE (year $YEAR)" | tee -a fetch-log.txt

            PAGE=0
            ALL_RESULTS="[]"
            success=false

            while true; do
              SKIP=$((PAGE * 300))
              URL="https://api.oireachtas.ie/v1/questions?date_start=${DATE}&date_end=${DATE}&limit=300&skip=${SKIP}&qtype=oral,written&show_answers=false"
              TEMPFILE="tmp_day_page.json"

              curl -s -w "%{http_code}" -o "$TEMPFILE" "$URL" > curl_status.txt
              STATUS=$(tail -n1 curl_status.txt)

              if [ "$STATUS" -eq 200 ]; then
                if jq -e '.message' "$TEMPFILE" >/dev/null 2>&1; then
                  echo "⚠️ API error on page $PAGE — retrying..." | tee -a fetch-log.txt
                elif jq -e '.results' "$TEMPFILE" >/dev/null 2>&1; then
                  COUNT=$(jq '.results | length' "$TEMPFILE")

                  if [ "$COUNT" -eq 0 ]; then
                    echo "✅ $DATE complete — no more results after page $PAGE" | tee -a fetch-log.txt
                    success=true
                    break
                  fi

                  ALL_RESULTS=$(jq -s '.[0] + .[1]' <(echo "$ALL_RESULTS") <(jq '.results' "$TEMPFILE"))
                  echo "✅ Page $PAGE for $DATE OK — $COUNT results" | tee -a fetch-log.txt
                  PAGE=$((PAGE + 1))
                else
                  echo "❌ Malformed JSON on page $PAGE — retrying..." | tee -a fetch-log.txt
                fi
              else
                echo "❌ HTTP $STATUS on page $PAGE — retrying..." | tee -a fetch-log.txt
              fi

              sleep 5
            done

            if [ "$success" = true ]; then
              echo "$ALL_RESULTS" > "$FILE"
              echo "💾 Wrote $FILE" | tee -a fetch-log.txt
            else
              if [ -f "$FILE" ]; then
                echo "🛑 Failed to fully fetch $DATE — using existing file" | tee -a fetch-log.txt
              else
                echo "🛑 No data for $DATE and no previous file exists" | tee -a fetch-log.txt
              fi
            fi

            echo "🕒 Sleeping 3s..." | tee -a fetch-log.txt
            sleep 3
          }

          d="$WINDOW_START"
          while [ "$(date -u -d "$d" +%s)" -le "$(date -u -d "$TODAY" +%s)" ]; do
            fetch_one_day "$d" || true
            d=$(date -u -d "$d +1 day" +%F)
          done

          rm -f tmp_day_page.json curl_status.txt
          echo "✅ Rolling fetch completed at $(date -u)" >> fetch-log.txt

      - name: Ensure package.json for ES modules
        run: |
          echo '{ "type": "module" }' > package.json

      - name: Merge affected year files into PQs_<year>_paginated.json
        run: |
          echo "📁 Listing contents of scripts"
          ls -l scripts
          echo "📁 Listing contents of data/PQs_paginated"
          ls -l data/PQs_paginated | head -n 50

          YEAR=$(date -u +%Y)

          echo "🚀 Merging current year: $YEAR"
          node scripts/merge-days-paginated.js "$YEAR"

          # If the rolling window reaches into the previous year, merge that too
          WINDOW_DAYS=183
          TODAY=$(date -u +%F)
          WINDOW_START=$(date -u -d "$TODAY -$WINDOW_DAYS days" +%F)
          WINDOW_START_YEAR=$(date -u -d "$WINDOW_START" +%Y)

          if [ "$WINDOW_START_YEAR" -lt "$YEAR" ]; then
            PREV_YEAR=$((YEAR - 1))
            echo "🚀 Window crosses year boundary — merging previous year: $PREV_YEAR"
            node scripts/merge-days-paginated.js "$PREV_YEAR"
          else
            echo "ℹ️ Window does not cross into previous year — skipping previous-year merge"
          fi

      - name: Commit daily and merged files to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          echo "🔍 Changed files:"
          git diff --name-only
          echo "📦 Files staged for commit:"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "⚠️ Nothing to commit — skipping push"
          else
            echo "📝 Committing changes..."
            git commit -m "Automated rolling fetch (paginated) and yearly merges" || {
              echo "❌ Git commit failed"
              exit 2
            }
            echo "🔄 Pulling with rebase to avoid conflicts..."
            git pull --rebase origin main || {
              echo "❌ Git pull with rebase failed"
              exit 2
            }
            echo "🚀 Pushing to origin..."
            git push origin HEAD || {
              echo "❌ Git push failed"
              exit 2
            }
          fi
