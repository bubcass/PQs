name: Backfill Oireachtas Questions 2015–2019 (paginated, monthly, safe)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-2015-2019
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean slate & block big files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          # Prevent any stray monolith from being tracked
          git rm --cached -f PQs_2015_2019_paginated.json PQs_2015_2019_paginated.json.gz 2>/dev/null || true
          rm -f PQs_2015_2019_paginated.json PQs_2015_2019_paginated.json.gz || true
          { echo "PQs_2015_2019_paginated.json"; echo "PQs_2015_2019_paginated.json.gz"; } >> .gitignore || true
          # Remove all untracked files just in case
          git clean -fdx

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch monthly PQs (2015 → 2019) with pagination
        shell: bash
        run: |
          set -euo pipefail
          BASE="data/PQs_2015_2019_paginated"
          mkdir -p "$BASE"
          zpad(){ printf "%02d" "$1"; }

          for Y in 2015 2016 2017 2018 2019; do
            for M in $(seq 1 12); do
              ym="${Y}-$(zpad $M)"
              FIRST="${Y}-$(zpad $M)-01"
              NEXT=$(date -d "$FIRST +1 month" +%F)
              LAST=$(date -d "$NEXT -1 day" +%F)

              OUT="$BASE/${ym}.json"
              TEMP="tmp_${ym}_page.json"
              STATUS="status_${ym}.txt"
              PAGE=0
              ALL="[]"

              echo "📅 Fetching ${ym} (${FIRST} → ${LAST})"

              while :; do
                SKIP=$((PAGE*300))
                URL="https://api.oireachtas.ie/v1/questions?date_start=${FIRST}&date_end=${LAST}&limit=300&skip=${SKIP}&qtype=oral,written&show_answers=false"

                curl -s -w "%{http_code}" -o "$TEMP" "$URL" > "$STATUS" || true
                CODE=$(tail -n1 "$STATUS")

                if [ "$CODE" -ne 200 ]; then
                  echo "❌ HTTP $CODE on page $PAGE — retrying in 5s"
                  sleep 5
                  continue
                fi

                if jq -e '.message' "$TEMP" >/dev/null 2>&1; then
                  echo "⚠️ API error envelope on page $PAGE — retrying in 5s"
                  sleep 5
                  continue
                fi

                if ! jq -e '.results' "$TEMP" >/dev/null 2>&1; then
                  echo "❌ Malformed JSON on page $PAGE — retrying in 5s"
                  sleep 5
                  continue
                fi

                COUNT=$(jq '.results | length' "$TEMP")
                if [ "$COUNT" -eq 0 ]; then
                  echo "✅ ${ym} complete — no more results after page $PAGE"
                  break
                fi

                ALL=$(jq -s '.[0] + .[1]' <(echo "$ALL") <(jq '.results' "$TEMP"))
                echo "✅ Page $PAGE for ${ym} — $COUNT results"
                PAGE=$((PAGE+1))
                sleep 5
              done

              echo "$ALL" > "$OUT"
              echo "💾 Wrote $OUT ($(jq 'length' "$OUT") items)"
            done
          done

          rm -f tmp_*.json status_*.txt || true

      - name: Merge monthlies → yearly files
        shell: bash
        run: |
          set -euo pipefail
          BASE="data/PQs_2015_2019_paginated"
          mkdir -p "$BASE"

          merge_year(){
            y=$1
            if ls "$BASE/$y-"*.json >/dev/null 2>&1; then
              jq -s 'add' "$BASE/$y-"*.json > "$BASE/PQs_${y}_paginated.json"
              echo "💾 Year $y: $(jq 'length' "$BASE/PQs_${y}_paginated.json") items"
            else
              echo "⚠️ No monthly files for $y"
            fi
          }

          for y in 2015 2016 2017 2018 2019; do
            merge_year $y
          done

      - name: Build monolith in /tmp (artifact only)
        shell: bash
        run: |
          set -euo pipefail
          BASE="data/PQs_2015_2019_paginated"
          TMPDIR="$(mktemp -d)"
          MONO="${TMPDIR}/PQs_2015_2019_paginated.json"

          if ls "$BASE/PQs_"*_paginated.json >/dev/null 2>&1; then
            jq -s 'add' \
              "$BASE/PQs_2015_paginated.json" \
              "$BASE/PQs_2016_paginated.json" \
              "$BASE/PQs_2017_paginated.json" \
              "$BASE/PQs_2018_paginated.json" \
              "$BASE/PQs_2019_paginated.json" \
              > "$MONO"
            gzip -9 "$MONO"
            echo "MONO_GZ=${MONO}.gz" >> $GITHUB_ENV
            du -h "${MONO}.gz" | cat
          else
            echo "⚠️ Yearly files missing; skipping monolith."
          fi

      - name: Upload monolith artifact
        if: ${{ env.MONO_GZ }}
        uses: actions/upload-artifact@v4
        with:
          name: PQs_2015_2019_paginated_json_gz
          path: ${{ env.MONO_GZ }}
          if-no-files-found: ignore
          compression-level: 0

      - name: Stage & commit safe files ONLY
        shell: bash
        run: |
          set -euo pipefail
          # Snapshot safe outputs to /tmp
          SNAP="$(mktemp -d)"
          rsync -a --delete data/PQs_2015_2019_paginated/ "$SNAP/PQs_2015_2019_paginated/"
          cp -f .gitignore "$SNAP/.gitignore" 2>/dev/null || true

          # Hard reset again to ensure zero bad history
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

          # Restore snapshot
          mkdir -p data
          rsync -a "$SNAP/PQs_2015_2019_paginated/" data/PQs_2015_2019_paginated/
          [ -f "$SNAP/.gitignore" ] && cp -f "$SNAP/.gitignore" .gitignore || true
          { echo "PQs_2015_2019_paginated.json"; echo "PQs_2015_2019_paginated.json.gz"; } >> .gitignore || true

          # Whitelist staging
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .gitignore
          git add data/PQs_2015_2019_paginated/2015-*.json 2>/dev/null || true
          git add data/PQs_2015_2019_paginated/2016-*.json 2>/dev/null || true
          git add data/PQs_2015_2019_paginated/2017-*.json 2>/dev/null || true
          git add data/PQs_2015_2019_paginated/2018-*.json 2>/dev/null || true
          git add data/PQs_2015_2019_paginated/2019-*.json 2>/dev/null || true
          git add data/PQs_2015_2019_paginated/PQs_201*_paginated.json 2>/dev/null || true

          echo "🔍 Staged files:"
          git diff --cached --name-only || true

          # Guards (monolith should never be staged)
          if git diff --cached --name-only | grep -q '^PQs_2015_2019_paginated\.json$'; then
            echo "❌ Monolith staged — aborting"; exit 3; fi
          if git diff --cached --name-only | grep -q '^PQs_2015_2019_paginated\.json\.gz$'; then
            echo "❌ Monolith .gz staged — aborting"; exit 3; fi

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Backfill 2015–2019: monthly shards + yearly merges (monolith as artifact only)"
            git pull --rebase origin main || true
            git push origin HEAD
          fi
