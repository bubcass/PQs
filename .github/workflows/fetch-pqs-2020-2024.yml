name: Backfill Oireachtas Questions 2020–2024 (paginated, monthly)

on:
  workflow_dispatch:

# Needed so the workflow can push commits back to the repo.
permissions:
  contents: write

concurrency:
  group: backfill-2020-2024
  cancel-in-progress: false

jobs:
  backfill-monthly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Backfill PQ data (Jan 2020 → Dec 2024) with pagination — monthly files
        shell: bash
        run: |
          set -euo pipefail

          BASE_DIR="data/PQs_2020_2024_paginated"
          LOG_FILE="backfill-log.txt"
          mkdir -p "$BASE_DIR"
          : > "$LOG_FILE"

          echo "🕓 Backfill started at $(date -u)" | tee -a "$LOG_FILE"

          START_YEAR=2020
          START_MONTH=1
          END_YEAR=2024
          END_MONTH=12

          zpad() { printf "%02d" "$1"; }

          year=$START_YEAR
          month=$START_MONTH

          while true; do
            ym="${year}-$(zpad "$month")"
            FIRST_DAY="${year}-$(zpad "$month")-01"
            NEXT_MONTH=$(date -d "${FIRST_DAY} +1 month" +%F)
            LAST_DAY=$(date -d "${NEXT_MONTH} -1 day" +%F)

            OUT_FILE="${BASE_DIR}/${ym}.json"
            TEMPFILE="tmp_${ym}_page.json"
            STATUS_FILE="curl_status_${ym}.txt"

            echo "📅 Fetching ${ym} (${FIRST_DAY} → ${LAST_DAY})" | tee -a "$LOG_FILE"

            PAGE=0
            ALL_RESULTS="[]"
            success=false

            while true; do
              SKIP=$((PAGE * 300))
              URL="https://api.oireachtas.ie/v1/questions?date_start=${FIRST_DAY}&date_end=${LAST_DAY}&limit=300&skip=${SKIP}&qtype=oral,written&show_answers=false"

              curl -s -w "%{http_code}" -o "$TEMPFILE" "$URL" > "$STATUS_FILE" || true
              STATUS=$(tail -n1 "$STATUS_FILE")

              if [ "$STATUS" -eq 200 ]; then
                if jq -e '.message' "$TEMPFILE" >/dev/null 2>&1; then
                  echo "⚠️ API error on page $PAGE for ${ym} — retrying..." | tee -a "$LOG_FILE"
                elif jq -e '.results' "$TEMPFILE" >/dev/null 2>&1; then
                  COUNT=$(jq '.results | length' "$TEMPFILE")
                  if [ "$COUNT" -eq 0 ]; then
                    echo "✅ ${ym} complete — no more results after page $PAGE" | tee -a "$LOG_FILE"
                    success=true
                    break
                  fi
                  ALL_RESULTS=$(jq -s '.[0] + .[1]' <(echo "$ALL_RESULTS") <(jq '.results' "$TEMPFILE"))
                  echo "✅ Page $PAGE for ${ym} OK — $COUNT results" | tee -a "$LOG_FILE"
                  PAGE=$((PAGE + 1))
                else
                  echo "❌ Malformed JSON on page $PAGE for ${ym} — retrying..." | tee -a "$LOG_FILE"
                fi
              else
                echo "❌ HTTP $STATUS on page $PAGE for ${ym} — retrying..." | tee -a "$LOG_FILE"
              fi

              sleep 5
            done

            if [ "$success" = true ]; then
              echo "$ALL_RESULTS" > "$OUT_FILE"
              echo "💾 Wrote ${OUT_FILE} ($(jq 'length' "$OUT_FILE") items)" | tee -a "$LOG_FILE"
            else
              if [ -f "$OUT_FILE" ]; then
                echo "🛑 Failed to fully fetch ${ym} — using existing file" | tee -a "$LOG_FILE"
              else
                echo "🛑 No data for ${ym} and no previous file exists" | tee -a "$LOG_FILE"
              fi
            fi

            if [ "$year" -eq "$END_YEAR" ] && [ "$month" -eq "$END_MONTH" ]; then
              break
            fi
            if [ "$month" -eq 12 ]; then
              month=1
              year=$((year + 1))
            else
              month=$((month + 1))
            fi

            echo "🕒 Sleeping 10s before next month..." | tee -a "$LOG_FILE"
            sleep 10
          done

          echo "✅ Monthly backfill completed at $(date -u)" | tee -a "$LOG_FILE"

      - name: Merge monthly files into yearly JSONs (safe for Git)
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="data/PQs_2020_2024_paginated"
          mkdir -p "${BASE_DIR}"

          merge_glob () {
            local pattern="$1" out="$2"
            if ls ${pattern} >/dev/null 2>&1; then
              jq -s 'add' ${pattern} > "${out}"
              echo "💾 Wrote ${out} (items: $(jq 'length' "${out}"))"
            else
              echo "⚠️ No files matched: ${pattern}"
            fi
          }

          merge_glob "${BASE_DIR}/2020-*.json" "${BASE_DIR}/PQs_2020_paginated.json"
          merge_glob "${BASE_DIR}/2021-*.json" "${BASE_DIR}/PQs_2021_paginated.json"
          merge_glob "${BASE_DIR}/2022-*.json" "${BASE_DIR}/PQs_2022_paginated.json"
          merge_glob "${BASE_DIR}/2023-*.json" "${BASE_DIR}/PQs_2023_paginated.json"
          merge_glob "${BASE_DIR}/2024-*.json" "${BASE_DIR}/PQs_2024_paginated.json"

          # Build all-years monolithic file but DO NOT commit it
          if ls "${BASE_DIR}/PQs_"*_paginated.json >/dev/null 2>&1; then
            jq -s 'add' \
              "${BASE_DIR}/PQs_2020_paginated.json" \
              "${BASE_DIR}/PQs_2021_paginated.json" \
              "${BASE_DIR}/PQs_2022_paginated.json" \
              "${BASE_DIR}/PQs_2023_paginated.json" \
              "${BASE_DIR}/PQs_2024_paginated.json" \
              > "PQs_2020_2024_paginated.json"

            gzip -9 -f "PQs_2020_2024_paginated.json"
            echo "🗜️  Gzipped monolith: PQs_2020_2024_paginated.json.gz (size: $(du -h PQs_2020_2024_paginated.json.gz | cut -f1))"
          fi

      - name: Upload monolithic gz as artifact (not committed)
        if: ${{ hashFiles('PQs_2020_2024_paginated.json.gz') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PQs_2020_2024_paginated_json_gz
          path: PQs_2020_2024_paginated.json.gz
          if-no-files-found: ignore
          compression-level: 0  # already gzipped

      - name: Commit backfill (monthlies + yearly merges) to repo
        shell: bash
        run: |
          set -euo pipefail

          # Ensure the giant files are ignored forever
          { echo "PQs_2020_2024_paginated.json"; echo "PQs_2020_2024_paginated.json.gz"; } >> .gitignore || true

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add only monthlies and yearlies
          git add .gitignore data/PQs_2020_2024_paginated/*.json

          echo "🔍 Changed files:"
          git diff --name-only || true
          echo "📦 Files staged for commit:"
          git diff --cached --name-only || true

          if git diff --cached --quiet; then
            echo "⚠️ Nothing to commit — skipping push"
          else
            echo "📝 Committing changes..."
            git commit -m "Backfill 2020–2024 monthly shards + yearly merges (artifact for monolith; no files >100MB)"
            echo "🔄 Pulling with rebase to avoid conflicts..."
            git pull --rebase origin main || true
            echo "🚀 Pushing to origin..."
            git push origin HEAD
          fi
